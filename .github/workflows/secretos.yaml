# Revisión de secretos (0.8.0; vigente en 0.9.0): busca claves o tokens escritos por error en el código (OpenAlex, EPPO, GitHub...).
# Complementa la revisión que hace dev/06_preparar_publicacion.R antes de publicar.
name: secretos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - name: Buscar secretos en el historial
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1
