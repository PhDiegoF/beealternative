# Integración continua (0.8.0): corre las pruebas del paquete en cada push y pull request al repositorio privado.
# Si alguna falla, GitHub marca el commit en rojo y avisa por correo: no publiques en Connect Cloud hasta corregirlo.
# Las pruebas que consultan OpenAlex se omiten salvo que el repositorio tenga el secreto OPENALEX_API_KEY
# (Settings → Secrets and variables → Actions). Los repositorios privados tienen 2.000 minutos gratis al mes.
# Diseño y conceptualización: Diego Hernando Flórez Martínez, PhD (ORCID 0000-0002-3904-9543) · AGROSAVIA
name: pruebas

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
      - name: Pruebas del paquete
        run: |
          pkgload::load_all()
          r <- as.data.frame(testthat::test_local(reporter = "summary", stop_on_failure = TRUE))
          cat("Bloques:", nrow(r), "· fallas:", sum(r$failed), "· omitidas:", sum(r$skipped), "\n")
        shell: Rscript {0}
